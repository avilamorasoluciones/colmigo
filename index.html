<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="description" content="Colmigo: tu vida, Colombia y tus cosas importantes en un solo lugar. Recordatorios, documentos, hogar, movilidad, pagos y más.">
  <meta name="keywords" content="Colmigo, Colombia, app colombiana, recordatorios, documentos, hogar, pagos, PWA, vida digital">
  <meta name="author" content="Avila Mora Soluciones">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Colmigo — Tu vida, en un solo lugar">
  <meta property="og:description" content="La plataforma digital colombiana para organizar lo importante de tu vida.">
  <meta property="og:image" content="assets/colmigo-icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Colmigo">
  <link rel="canonical" href="https://avilamorasoluciones.github.io/colmigo/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/colmigo-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/colmigo-icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
  <title>Colmigo — Tu vida, en un solo lugar</title>
</head>
<body>
  <div id="splash" class="splash"><img src="assets/colmigo-icon.svg" alt="Colmigo"><span>Colmigo</span></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="container-fluid px-3 px-lg-4">
        <div class="d-flex align-items-center justify-content-between gap-3">
          <button class="brand-btn" data-view="inicio" aria-label="Ir a inicio">
            <img src="assets/colmigo-icon.svg" alt="" class="brand-icon"><span>colmigo</span>
          </button>
          <div class="top-actions">
            <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"><i class="fa-solid fa-moon"></i></button>
            <button class="avatar-btn" id="profileBtn" aria-label="Cuenta"><span>DA</span></button>
          </div>
        </div>
      </div>
    </header>

    <main class="container-fluid px-3 px-lg-4 pb-5">
      <section id="view-inicio" class="view active">
        <div class="hero-card mt-3">
          <div>
            <span class="eyebrow"><i class="fa-solid fa-location-dot"></i> Colombia</span>
            <h1>Hola, Diego <span>👋</span></h1>
            <p>Lo importante de tu vida, contigo.</p>
          </div>
          <button class="quick-add" data-action="new"><i class="fa-solid fa-plus"></i><span>Agregar</span></button>
        </div>

        <div class="stats-grid mt-3">
          <button class="stat-card" data-view="recordatorios"><span class="stat-icon purple"><i class="fa-regular fa-bell"></i></span><strong id="pendingCount">2</strong><small>Pendientes</small></button>
          <button class="stat-card" data-view="documentos"><span class="stat-icon blue"><i class="fa-regular fa-file-lines"></i></span><strong id="documentCount">4</strong><small>Documentos</small></button>
          <button class="stat-card" data-view="pagos"><span class="stat-icon green"><i class="fa-solid fa-wallet"></i></span><strong id="paymentCount">3</strong><small>Pagos próximos</small></button>
          <button class="stat-card" data-view="colombia"><span class="stat-icon yellow"><i class="fa-solid fa-star"></i></span><strong>🇨🇴</strong><small>Colombia</small></button>
        </div>

        <div class="section-heading mt-4"><div><span class="eyebrow">Tu día</span><h2>Para hoy</h2></div><button class="text-btn" data-view="recordatorios">Ver todo</button></div>
        <div class="timeline-card">
          <button class="task-row" data-task="internet"><span class="check pending"></span><span><strong>Pagar internet</strong><small>Vence mañana · $89.900</small></span><i class="fa-solid fa-chevron-right"></i></button>
          <button class="task-row" data-task="cumple"><span class="check pending"></span><span><strong>Comprar regalo</strong><small>Cumpleaños de mamá · sábado</small></span><i class="fa-solid fa-chevron-right"></i></button>
          <button class="task-row" data-task="cita"><span class="check done"><i class="fa-solid fa-check"></i></span><span><strong>Cita médica</strong><small>Hoy · 4:30 p. m.</small></span><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="section-heading mt-4"><div><span class="eyebrow">Accesos</span><h2>Todo Colmigo</h2></div></div>
        <div class="module-grid">
          <button class="module-card" data-view="recordatorios"><i class="fa-regular fa-bell"></i><span>Recordatorios</span><small>No olvides lo importante</small></button>
          <button class="module-card" data-view="documentos"><i class="fa-regular fa-folder-open"></i><span>Documentos</span><small>Todo seguro y organizado</small></button>
          <button class="module-card" data-view="hogar"><i class="fa-solid fa-house"></i><span>Mi hogar</span><small>Servicios y garantías</small></button>
          <button class="module-card" data-view="movilidad"><i class="fa-solid fa-car-side"></i><span>Movilidad</span><small>SOAT y vehículo</small></button>
          <button class="module-card" data-view="pagos"><i class="fa-solid fa-wallet"></i><span>Mis pagos</span><small>Próximos vencimientos</small></button>
          <button class="module-card" data-view="familia"><i class="fa-solid fa-people-roof"></i><span>Familia</span><small>Compartir lo importante</small></button>
          <button class="module-card" data-view="colombia"><i class="fa-solid fa-mountain-sun"></i><span>Colombia</span><small>Servicios y guía local</small></button>
          <button class="module-card premium-card" data-view="premium"><i class="fa-solid fa-sparkles"></i><span>Colmigo Plus</span><small>Más herramientas</small></button>
        </div>

        <div class="assistant-card mt-4" data-view="asistente">
          <div class="assistant-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          <div class="flex-grow-1"><span class="eyebrow">Asistente Colmigo</span><h3>¿Qué necesitas organizar?</h3><p>Pregúntame por tus pendientes, fechas o documentos.</p></div>
          <i class="fa-solid fa-arrow-right"></i>
        </div>
      </section>

      <section id="view-recordatorios" class="view"></section>
      <section id="view-documentos" class="view"></section>
      <section id="view-hogar" class="view"></section>
      <section id="view-movilidad" class="view"></section>
      <section id="view-pagos" class="view"></section>
      <section id="view-familia" class="view"></section>
      <section id="view-colombia" class="view"></section>
      <section id="view-premium" class="view"></section>
      <section id="view-asistente" class="view"></section>
      <section id="view-cuenta" class="view"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="inicio"><i class="fa-solid fa-house"></i><span>Inicio</span></button>
      <button class="nav-item" data-view="recordatorios"><i class="fa-regular fa-bell"></i><span>Agenda</span></button>
      <button class="nav-add" data-action="new"><i class="fa-solid fa-plus"></i></button>
      <button class="nav-item" data-view="colombia"><i class="fa-solid fa-mountain-sun"></i><span>Colombia</span></button>
      <button class="nav-item" data-view="premium"><i class="fa-regular fa-user"></i><span>Cuenta</span></button>
    </nav>
  </div>

  <div class="install-banner" id="installBanner">
    <img src="assets/colmigo-icon.svg" alt="">
    <div><strong>Instala Colmigo</strong><small>Ten tu vida siempre a mano.</small></div>
    <button id="installBtn" class="btn btn-dark rounded-pill">Instalar</button>
    <button id="installClose" class="close-install" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content app-modal">
        <div class="modal-header border-0"><h5 class="modal-title">Agregar a Colmigo</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body pt-0">
          <div class="add-options">
            <button data-add="recordatorio"><i class="fa-regular fa-bell"></i><span><strong>Recordatorio</strong><small>Algo que no quieres olvidar</small></span></button>
            <button data-add="documento"><i class="fa-regular fa-file-lines"></i><span><strong>Documento</strong><small>Guarda una fecha o archivo</small></span></button>
            <button data-add="pago"><i class="fa-solid fa-wallet"></i><span><strong>Pago</strong><small>Una cuenta o suscripción</small></span></button>
            <button data-add="vehiculo"><i class="fa-solid fa-car"></i><span><strong>Vehículo</strong><small>SOAT, revisión o mantenimiento</small></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="appToast" class="toast app-toast" role="alert"><div class="toast-body"></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
